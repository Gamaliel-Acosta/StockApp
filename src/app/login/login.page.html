<ion-content [fullscreen]="true">
  <div class="page">
    <div class="container" aria-labelledby="login-title">
      <section class="left">
        <h1 id="login-title" class="login">Login</h1>
        <div class="eula">
          Inicia sesión para acceder a tu aplicación. Tu sesión se mantendrá
          disponible mientras utilizas el dispositivo.
        </div>
      </section>

      <section class="right">
        <svg class="route" viewBox="0 0 320 300" aria-hidden="true">
          <defs>
            <linearGradient
              id="linearGradient"
              x1="13"
              y1="193.49992"
              x2="307"
              y2="193.49992"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#ff00ff" offset="0"></stop>
              <stop stop-color="#ff0000" offset="1"></stop>
            </linearGradient>
          </defs>
          <path
            #routePath
            d="m 40,120.00016
               239.99984,-3.2e-4
               c 0,0 24.99263,0.79932 25.00016,35.00016
               0.008,34.20084 -25.00016,35 -25.00016,35
               h -239.99984
               c 0,-0.0205 -25,4.01348 -25,38.5
               0,34.48652 25,38.5 25,38.5
               h 215
               c 0,0 20,-0.99604 20,-25
               0,-24.00396 -20,-25 -20,-25
               h -190
               c 0,0 -20,1.71033 -20,25
               0,24.00396 20,25 20,25
               h 168.57143"
          ></path>
        </svg>

        <form class="form" (submit)="onEnter($event)">
          <ion-item lines="none" class="field">
            <ion-label position="stacked">Email</ion-label>
            <ion-input
              [(ngModel)]="email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              [disabled]="loading"
              placeholder="usuario@correo.com"
              (ionFocus)="moveRouteTo('email')"
            ></ion-input>
          </ion-item>

          <ion-item lines="none" class="field">
            <ion-label position="stacked">Password</ion-label>
            <ion-input
              [(ngModel)]="password"
              name="password"
              type="password"
              autocomplete="current-password"
              [disabled]="loading"
              placeholder="********"
              (ionFocus)="moveRouteTo('password')"
            ></ion-input>
          </ion-item>

          <ion-text color="danger" *ngIf="errorMessage">
            <p class="error">{{ errorMessage }}</p>
          </ion-text>

          <ion-button
            type="submit"
            expand="block"
            fill="clear"
            class="submit-button"
            [disabled]="loading"
            (focus)="moveRouteTo('button')"
          >
            <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
            <span *ngIf="!loading">Iniciar sesión</span>
            <span *ngIf="loading">Conectando...</span>
          </ion-button>
        </form>
      </section>
    </div>
  </div>
</ion-content>
